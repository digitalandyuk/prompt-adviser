name: Check release
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/build.py
      - run: python3 scripts/check.py
      - run: git diff --exit-code -- dist
