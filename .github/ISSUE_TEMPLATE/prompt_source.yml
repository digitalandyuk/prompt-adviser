name: Prompt source
description: Suggest a free open-source prompt source
title: "Source: "
body:
  - type: input
    id: url
    attributes:
      label: Source URL
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Exact licence and link
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Useful prompt type and concrete benefit
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: Platform limits or rights caveats
